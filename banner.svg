<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Sourabh Goswami - Backend, DevOps and Low-Level Enthusiast">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" y="3" fill="#58a6ff" fill-opacity="0.04"/>
    </pattern>
    <style>
      .mono  { font-family: 'DM Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; text-transform: uppercase; }
      .serif { font-family: 'DM Serif Display', Georgia, 'Times New Roman', serif; }

      .fade { opacity: 0; animation: fadeUp 0.6s ease both; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .rule {
        transform-box: fill-box;
        transform-origin: 50% 0;
        animation: ruleGrow 0.6s cubic-bezier(0.77, 0, 0.175, 1) 0.1s both;
      }
      @keyframes ruleGrow {
        from { transform: scaleY(0); }
        to   { transform: scaleY(1); }
      }

      /* Role cycling: each line is visible for 1/3 of a 9s loop */
      .role { opacity: 0; animation: cycle 9s linear infinite; }
      @keyframes cycle {
        0%, 30%   { opacity: 1; }
        33%, 100% { opacity: 0; }
      }

      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background, scanlines, border -->
  <rect width="900" height="220" fill="#0a0a0a"/>
  <rect width="900" height="220" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="897" height="217" fill="none" stroke="#58a6ff" stroke-width="3"/>

  <!-- Corner marks -->
  <g fill="none" stroke="#58a6ff" stroke-width="3">
    <path d="M10 34 V10 H34"/>
    <path d="M866 10 H890 V34"/>
    <path d="M10 186 V210 H34"/>
    <path d="M866 210 H890 V186"/>
  </g>

  <!-- Vertical rule -->
  <rect class="rule" x="48" y="28" width="2" height="164" fill="#58a6ff"/>

  <!-- Top-right index -->
  <text class="mono" x="852" y="26" text-anchor="end" font-size="9" letter-spacing="2.7" fill="#8b949e">Profile / Sourabh</text>

  <!-- Label -->
  <text class="mono fade" x="72" y="62" font-size="10" font-weight="500" letter-spacing="3" fill="#88a8ff" style="animation-delay:0.5s">Backend, DevOps &amp; Low-Level Enthusiast</text>

  <!-- Name -->
  <text class="serif fade" x="72" y="116" font-size="52" letter-spacing="-1" fill="#f0f6fc" style="animation-delay:0.65s">Sourabh Goswami</text>

  <!-- Rotating role -->
  <g class="fade" style="animation-delay:0.85s">
    <text class="mono" x="72" y="146" font-size="11" letter-spacing="2.2" fill="#58a6ff">→</text>
    <g class="mono" font-size="11" font-weight="500" letter-spacing="2" fill="#f0f6fc">
      <text class="role" x="96" y="146" style="animation-delay:1.2s">Backend · Cloud · DevOps Systems<tspan class="cursor" fill="#58a6ff"> ▍</tspan></text>
      <text class="role" x="96" y="146" style="animation-delay:4.2s">Python · Tensorflow · MLOPS Systems<tspan class="cursor" fill="#58a6ff"> ▍</tspan></text>
      <text class="role" x="96" y="146" style="animation-delay:7.2s">WebSockets · Next.js · Real-Time<tspan class="cursor" fill="#58a6ff"> ▍</tspan></text>
    </g>
  </g>

  <!-- Tags -->
  <g class="fade" style="animation-delay:1.05s">
    <g class="mono" font-size="9" font-weight="500" letter-spacing="1.8">
      <rect x="72"  y="164" width="96" height="18" fill="#58a6ff"/>
      <text x="80"  y="176.5" fill="#0a0a0a">Self-Taught</text>
      <rect x="176" y="164" width="82" height="18" fill="#58a6ff"/>
      <text x="184" y="176.5" fill="#0a0a0a">Low-Level</text>
      <rect x="266" y="164" width="60" height="18" fill="#58a6ff"/>
      <text x="274" y="176.5" fill="#0a0a0a">20 Y/O</text>
      <rect x="334" y="164" width="82" height="18" fill="#58a6ff"/>
      <text x="342" y="176.5" fill="#0a0a0a">Real-Time</text>
    </g>
  </g>

  <!-- Stats block -->
  <g class="fade" style="animation-delay:1.1s">
    <text class="serif" x="852" y="112" text-anchor="end" font-size="42" letter-spacing="-0.8" fill="#58a6ff">20</text>
    <text class="mono" x="852" y="130" text-anchor="end" font-size="9" letter-spacing="2.25" fill="#8b949e">Years of Age</text>
  </g>

  <!-- Baseline -->
  <text class="mono fade" x="72" y="205" font-size="8" letter-spacing="2.4" fill="#8b949e" style="animation-delay:1.3s">sourabhgoswamii.vercel.app</text>
</svg>
